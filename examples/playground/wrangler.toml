# The live demo: the page's static files plus one Worker with a Durable Object
# behind /api/* and /ws (the lab, reached over @command-kernel/wire).
#
#   bun run dev               # vite + the real Workers runtime (@cloudflare/vite-plugin)
#   bun run deploy            # build + deploy
#
# account_id is intentionally absent: it comes from the CLOUDFLARE_ACCOUNT_ID env var
# (convention: never commit the account id).
name = "command-system-lab"
main = "./worker/index.ts"
compatibility_date = "2026-06-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# the lab's paths reach the Worker; everything else is a static file, served without it
run_worker_first = ["/api/*", "/ws"]

[[durable_objects.bindings]]
name = "LAB"
class_name = "LabDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LabDO"]
